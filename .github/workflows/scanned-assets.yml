name: Inspect scanned actor
on:
  push:
    branches: [visual-assets-trial]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scanned-download.py
      - run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy python3-pil
      - run: blender -b -t 2 --python-exit-code 1 --python scripts/scanned-inspect.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m pip install Pillow==10.4.0
      - run: npm ci && npm run assets
      - run: blender -b -t 2 --python-exit-code 1 --python scripts/prepare-scanned.py
      - run: npm test && npm run build
      - name: Render scanned character in the gameplay scene
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 --directory dist > /tmp/server.log 2>&1 &
          sleep 2
          node scripts/capture.mjs --stills
      - name: Publish only rendered previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-previews.mjs
      - name: Publish metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,subprocess,os
          data=base64.b64encode(open('scan-inspection.json','rb').read()).decode()
          body={'message':'Inspect licensed actor structure (metadata only)','content':data,'branch':'visual-assets-trial'}
          p=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/docs/scanned-inspection.json'],capture_output=True,text=True)
          if p.returncode==0:body['sha']=json.loads(p.stdout)['sha']
          subprocess.run(['gh','api','--method','PUT','repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/docs/scanned-inspection.json','--input','-'],input=json.dumps(body),text=True,check=True)
          PY
