name: Inspect rendered PV frames
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-pv.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: giants-hiding-pv-bf01a57682fa076c1eb877b95d6ea37b7615b19f
          run-id: 39473469033
          github-token: ${{ github.token }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: pv-review-frames
          run-id: 39473469033
          github-token: ${{ github.token }}
          path: output
      - name: Select the sheet extracted from the encoded MP4
        run: cp output/motion-sheet.jpg output/frame-encoded-motion-sheet.jpg
      - name: Publish review files with readable image data
        env:
          GH_TOKEN: ${{ github.token }}
          PV_SOURCE_SHA: bf01a57682fa076c1eb877b95d6ea37b7615b19f
          PV_SOURCE_RUN: '39473469033'
        run: node scripts/publish-previews.mjs
