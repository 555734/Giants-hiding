name: Inspect rendered PV frames
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-pv.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: giants-hiding-pv-1ada34959fbc352d6ea1653bec02b064e76ec464
          run-id: 39687068995
          github-token: ${{ github.token }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: pv-review-frames
          run-id: 39687068995
          github-token: ${{ github.token }}
          path: output
      - name: Extract full-resolution gameplay previews from the encoded MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          for T in 07.50 25.50 28.50; do
            ffmpeg -hide_banner -loglevel error -y -ss "$T" -i output/giants-hiding-pv-30s.mp4 -frames:v 1 -q:v 2 "output/frame-$T.jpg"
          done
      - name: Publish a gameplay preview with the video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload pv-build-31 output/frame-25.50.jpg output/frame-07.50.jpg output/frame-28.50.jpg --clobber
      - name: Prepare a compact sheet extracted from the encoded MP4
        run: |
          python3 -m pip install Pillow==10.4.0
          python3 - <<'PY'
          from PIL import Image
          with Image.open('output/motion-sheet.jpg') as im:
              im.thumbnail((960,2000),Image.Resampling.LANCZOS)
              im.save('output/frame-encoded-motion-sheet.jpg',quality=80)
          PY
      - name: Publish review files with readable image data
        env:
          GH_TOKEN: ${{ github.token }}
          PV_SOURCE_SHA: 1ada34959fbc352d6ea1653bec02b064e76ec464
          PV_SOURCE_RUN: '39687068995'
        run: node scripts/publish-previews.mjs
