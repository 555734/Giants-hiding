name: PV capture
on:
  workflow_dispatch:
    inputs:
      full:
        description: Render full 30-second MP4
        type: boolean
        default: true
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run assets && npm test && npm run build
      - name: Start prototype
        run: |
          npm run dev > /tmp/giants-vite.log 2>&1 &
          python3 - <<'PY'
          import urllib.request,time
          for i in range(60):
            try:
              urllib.request.urlopen('http://127.0.0.1:5173/');break
            except Exception:time.sleep(1)
          else:raise SystemExit('Vite did not start')
          PY
      - name: Capture review frames
        run: npm run pv:stills
      - name: Publish review frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('output/review-frames.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('output').glob('frame-*.jpg'):z.write(p,p.name)
            z.write('output/stills-telemetry.json','stills-telemetry.json')
          PY
          gh release view pv-review >/dev/null 2>&1 || gh release create pv-review --title 'PV review frames — work in progress' --prerelease --notes 'Review frames from the continuous 3D prototype. See README for asset credits.'
          gh release upload pv-review output/review-frames.zip --clobber
      - name: Full MP4
        if: ${{ inputs.full == true || contains(github.event.head_commit.message, '[render-pv]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install numpy==1.26.4 scipy==1.13.1 Pillow==10.4.0
          python3 scripts/audio.py
          npm run pv:render
          python3 scripts/verify_video.py
      - name: Publish rendered video
        if: ${{ inputs.full == true || contains(github.event.head_commit.message, '[render-pv]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=pv-build-${{ github.run_number }}
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'Giants Hiding — 30-second 3D prototype PV' --notes-file docs/CREDITS.txt
          gh release upload "$TAG" output/giants-hiding-pv-30s.mp4 output/motion-sheet.jpg output/verification.json docs/CREDITS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: giants-hiding-pv-${{ github.sha }}
          path: output/
          retention-days: 30
